name: Tests

on:
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm ci

      # tsc dépend de types générés par Next.js (LayoutProps, PageProps...)
      # normalement produits par `next dev`/`build` — absents d'un checkout
      # propre en CI sans cette étape.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm test
