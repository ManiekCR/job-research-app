 "title": "Customer Success Manager (m/w/d)",
 "description": "\n    null\n    Über uns\n    <p>Bei softgarden zu arbeiten bedeutet, Recruiting immer wieder neu zu denken. Als einer der führenden Anbieter für Recruitinglösungen bringen wir Unternehmen und Bewerber:innen schnell und einfach zusammen. Mit unserer einzigartigen softgarden Feedbacklösung werden Employer Branding Strategien optimiert und Mitarbeiterbewertungen transparent dargestellt. softgarden steht gemeinsam mit 190 Mitarbeiter:innen für eine offene Unternehmenskultur in der jede:r motiviert, zuhört und vertraut. Wir sind stolz auf unseren Team Zusammenhalt und sind auf der Suche nach neuen Kolleg:innen, die unsere Mission unterstützen Recruiting zu modernisieren.</p>\n    Deine Rolle\n    <p>Mit einem breit aufgestellten Kundenportfolio, von innovativen KMU bis zu internationalen Enterprise-Unternehmen, betreuen wir heute rund 2.000 Kund:innen aus unterschiedlichsten Branchen. Im Mittelpunkt steht für uns eine enge und partnerschaftliche Betreuung nach dem Onboarding, damit unsere Kund:innen unsere Lösungen erfolgreich einsetzen und optimal nutzen können.</p><p>Als Customer Success Manager:in begleitest du deine Kund:innen im Alltag, berätst zu passenden Lösungen und sorgst für eine hohe Kundenzufriedenheit und langfristige Kundenbindung.</p><ul>\n<li>In der Bestandskundenbetreuung verantwortest du einen eigenen Kundenstamm im Enterprise-Segment und begleitest deine Kund:innen langfristig bei der erfolgreichen Nutzung von softgarden.</li>\n<li>Nach dem erfolgreichen Onboarding übernimmst du die Rolle als zentrale:r Ansprechpartner:in für alle fachlichen, technischen und kommerziellen Fragestellungen deiner Bestandskunden.</li>\n<li>In regelmäßigen Care Calls analysierst du die Nutzung unserer Lösungen, identifizierst Optimierungspotenziale und berätst deine Kund:innen zu passenden Produkten, Services und Zusatzmodulen.</li>\n<li>Durch Cross- und Upselling entwickelst du bestehende Kundenbeziehungen weiter, erstellst Angebote, führst Vertragsgespräche und unterstützt den nachhaltigen Ausbau deines Kundenportfolios.</li>\n<li>Bei komplexeren Anforderungen, etwa im Umfeld von Schnittstellen, Produktfunktionen oder individuellen Kundenanforderungen, arbeitest du eng mit internen Expert:innen zusammen und koordinierst die optimale Lösung.</li>\n<li>Du bist die zentrale Schnittstelle zwischen Kund:innen und internen Teams wie Product, Media Sales, Account Management und Customer Support.</li>\n<li>Mit deinem Blick auf Kundenzufriedenheit, Nutzung und Entwicklungspotenziale trägst du aktiv zur Kundenbindung, Churn Prevention und zum langfristigen Wachstum bestehender Accounts bei.</li>\n</ul>\n    Das bringst du mit\n    <ul>\n<li>Du verfügst über mindestens drei Jahre Berufserfahrung im Customer Success, Account Management oder einer vergleichbaren kundenorientierten Rolle.</li>\n<li>Der Aufbau langfristiger Kundenbeziehungen macht dir Spaß und du verstehst es, Kund:innen sowohl beratend als auch kommerziell zu begleiten.</li>\n<li>Idealerweise konntest du bereits Erfahrungen im Cross-Selling, Upselling, der Angebotserstellung oder in Vertragsgesprächen sammeln.</li>\n<li>MS Office und Salesforce beherrschst du sicher, Erfahrungen mit Jira sind von Vorteil.</li>\n<li>Technische Zusammenhänge schrecken dich nicht ab und du arbeitest dich gerne in neue Softwareprodukte und Prozesse ein.</li>\n<li>Du verfügst über ausgezeichnete Deutschkenntnisse (C2) sowie sehr gute Englischkenntnisse (C1).</li>\n<li>Kommunikationsstärke, Empathie, Verhandlungsgeschick und eine lösungsorientierte Arbeitsweise zeichnen dich aus.</li>\n</ul>\n    Damit können wir dich überzeugen\n    <p>Kaffee und kostenloses Obst im Büro sind toll, und ja, auch das haben wir. <strong>Aber seien wir mal ehrlich, darauf kommt es nicht wirklich an.</strong> Bei softgarden leben wir eine offene Unternehmenskultur, in der ...</p><ul>\n<li>die Arbeit sich nach dem Privatleben richtet und nicht umgekehrt</li>\n<li>faire Kommunikation und Feedback nicht nur irgendwelche Buzzwords sind</li>\n<li>flexible Arbeitszeiten und Home-Office selbstverständlich sind</li>\n</ul><p>Aber, das Andere haben wir natürlich auch ...</p><ul>\n<li>Volle Kostenübernahme des Deutschlandtickets oder alternativ JobRad-Leasing</li>\n<li>Betriebliche Altersvorsorge </li>\n<li>Moderne Hardware (Mac oder Windows, deine Wahl) </li>\n<li>Zugang zu Corporate Benefits </li>\n<li>Bis zu 20 Tage Workation pro Jahr gemäß unserer Workation-Richtlinie </li>\n<li>30 Tage Urlaub bei einer 5 Tage Woche </li>\n<li>Vergünstigte Wellpass-Mitgliedschaft </li>\n<li>Geburtstags- und Jubiläumsgeschenke</li>\n<li>Regelmäßige Teamevents, gemeinsame Mittagessen in Berlin und Saarbrücken sowie unsere jährliche Weihnachtsfeier</li>\n<li>Ein tolles, zentrales Büro in Berlin am Zoo</li>\n</ul><p><strong>Für die Position ist der Arbeitsort Berlin vorgesehen.</strong> Es gilt eine 4:1 Home-Office/Office-Regelung – das bedeutet, ein Tag in der Woche im Büro und die anderen kann von zu Hause gearbeitet werden. Während der Einarbeitungszeit von etwa 3 Monaten ist eine vollständige Anwesenheit im Office erforderlich.</p><p>Haben wir dein Interesse geweckt? Dann freuen wir uns von dir über das Online-Bewerbungsformular zu hören.</p>\n    Dein Kontakt\n    <p>Jane Doe<br>Talent Acquisition Manager</p>\n  ",
